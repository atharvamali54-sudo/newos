name: Build GlassOS Android APK

on:
  push:
    branches: [ main ]
    paths:
      - 'android/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.5

      - name: Build Android APK
        working-directory: ./android
        run: gradle assembleDebug --stacktrace

      - name: Prepare APK for Release
        run: |
          mkdir -p release-apk
          cp android/app/build/outputs/apk/debug/app-debug.apk release-apk/GlassOS-Launcher.apk

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GlassOS-Launcher-APK
          path: release-apk/GlassOS-Launcher.apk
          retention-days: 30

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.0-glass
          name: "GlassOS Android Launcher (Frosted Glass UI Suite)"
          body: |
            ## 🔮 GlassOS Official Android Launcher & System Suite
            - ✨ **Next-Gen Frosted Glassmorphism UI:** काचेसारखा पारदर्शक आणि प्रीमियम लूक!
            - 🏠 **Home Screen & App Drawer:** हुबेहूब फोटोप्रमाणे म्युझिक आणि कलेक्शन्स पॅनल.
            - ⚡ **Control Center & Quick Toggles:** वाय-फाय, ब्लूटूथ, फ्लॅशलाइट, ब्राइटनेस आणि व्हॉल्यूम स्लायडर्स.
            - 🔊 **Floating Volume Slider:** व्हॉल्यूम बटण दाबल्यावर स्क्रीनवर येणारा काचेचा स्लायडर.
            - 🔒 **Ambient Glass Lock Screen:** घड्याळ, म्युझिक विजेट आणि 'Slide to Unlock'.
          files: release-apk/GlassOS-Launcher.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
